# Pinned to API 26. Robolectric silently defaults a library module (one with
# no targetSdkVersion in its merged manifest) to API 23, which is below
# GnssStatus (added in API 24, used by AndroidRideSensorDataSource.kt's
# registerGnssStatusCallback call). Without this pin, tests that exercise that
# code path would fail against a Robolectric SDK that predates the API.
# core:database's MigrationTest has no such file because it doesn't touch any
# API gated above 23.
sdk=26
