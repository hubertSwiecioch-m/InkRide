name: Setup build environment
description: Sets up JDK 21 and Gradle, and makes gradlew executable. Requires actions/checkout to have already run.

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      shell: bash
      run: chmod +x ./gradlew
