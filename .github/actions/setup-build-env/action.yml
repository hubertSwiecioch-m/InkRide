name: Setup build environment
description: Checks out the repo, sets up JDK 21 and Gradle, and makes gradlew executable

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      shell: bash
      run: chmod +x ./gradlew
